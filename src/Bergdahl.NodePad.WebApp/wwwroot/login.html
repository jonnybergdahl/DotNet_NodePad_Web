<!DOCTYPE html>
<html lang="en" data-auth="out">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in · NodePad</title>
    <meta name="color-scheme" content="light dark">
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
    <link rel="alternate icon" href="/favicon.ico" sizes="any">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block">
    <!-- The template's theme and components, served without signing in (see Program.cs) -->
    <link rel="stylesheet" href="/css/theme.css">
    <link rel="stylesheet" href="/css/app.css">
    <script src="/js/theme.js"></script>
    <style>
        .login-form { display: flex; flex-direction: column; gap: var(--space-4); }
        .login-intro { margin: 0; color: var(--color-text-muted); text-align: center; }
        .field-error:empty { display: none; }
        .button:disabled { opacity: 0.4; cursor: default; }
        [hidden] { display: none !important; }
    </style>
</head>
<body>
<div class="login">
    <div class="login-card">
        <h1 class="login-title">
            <img class="app-icon" src="/assets/app-icon.svg" alt="" width="40" height="40">
            <span>NodePad</span>
        </h1>

        <form id="login-form" class="login-form" novalidate hidden>
            <label class="field">
                <span>User name</span>
                <input id="login-username" type="text" autocomplete="username" required>
            </label>
            <label class="field">
                <span>Password</span>
                <input id="login-password" type="password" autocomplete="current-password" required>
            </label>
            <label class="check">
                <input id="login-remember" type="checkbox">
                <span>Keep me signed in</span>
            </label>
            <button class="button" type="submit"><span class="icon">login</span>Sign in</button>
        </form>

        <form id="setup-form" class="login-form" novalidate hidden>
            <p class="login-intro">No account exists yet. Choose a user name and password to protect your notes.</p>
            <label class="field">
                <span>User name</span>
                <input id="setup-username" type="text" autocomplete="username" required>
            </label>
            <label class="field">
                <span>Password</span>
                <input id="setup-password" type="password" autocomplete="new-password" minlength="6" required>
                <small class="field-hint">At least 6 characters.</small>
            </label>
            <label class="field">
                <span>Confirm password</span>
                <input id="setup-confirm" type="password" autocomplete="new-password" minlength="6" required>
            </label>
            <button class="button" type="submit"><span class="icon">person_add</span>Create account</button>
        </form>

        <p id="error" class="field-error" role="alert"></p>
    </div>
</div>

<script>
(function () {
    const loginForm = document.getElementById('login-form');
    const setupForm = document.getElementById('setup-form');
    const errorEl = document.getElementById('error');

    function returnUrl() {
        const url = new URLSearchParams(location.search).get('ReturnUrl') || new URLSearchParams(location.search).get('returnUrl') || '/';
        // Only allow local paths to avoid open redirects
        const local = url.startsWith('/') && !url.startsWith('//') && !url.startsWith('/\\') ? url : '/';
        // The browser keeps the #/note part of a link through the sign-in redirect; carry it on to the note
        return local.includes('#') ? local : local + location.hash;
    }

    async function post(url, body) {
        const res = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
        });
        if (res.ok) return null;
        if (res.status === 429) return 'Too many attempts. Wait a minute and try again.';
        try { return (await res.json()).error || `Request failed (${res.status})`; }
        catch { return `Request failed (${res.status})`; }
    }

    async function submit(form, url, body) {
        errorEl.textContent = '';
        const button = form.querySelector('button');
        button.disabled = true;
        try {
            const error = await post(url, body);
            if (error) { errorEl.textContent = error; return; }
            location.replace(returnUrl());
        } catch {
            errorEl.textContent = 'Could not reach the server.';
        } finally {
            button.disabled = false;
        }
    }

    // Show validation problems in the page and focus the field, rather than relying on browser bubbles
    function invalid(fieldId, message) {
        errorEl.textContent = message;
        document.getElementById(fieldId).focus();
    }

    loginForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const username = document.getElementById('login-username').value.trim();
        const password = document.getElementById('login-password').value;
        if (!username) { invalid('login-username', 'Enter your user name.'); return; }
        if (!password) { invalid('login-password', 'Enter your password.'); return; }
        submit(loginForm, '/api/auth/login', {
            username,
            password,
            rememberMe: document.getElementById('login-remember').checked
        });
    });

    setupForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const username = document.getElementById('setup-username').value.trim();
        const password = document.getElementById('setup-password').value;
        if (!username) { invalid('setup-username', 'Choose a user name.'); return; }
        if (password.length < 6) { invalid('setup-password', 'The password must be at least 6 characters.'); return; }
        if (password !== document.getElementById('setup-confirm').value) {
            invalid('setup-confirm', 'The passwords do not match.');
            return;
        }
        submit(setupForm, '/api/auth/setup', { username, password });
    });

    (async function init() {
        try {
            const res = await fetch('/api/auth/status');
            const status = await res.json();
            if (status.authenticated) { location.replace(returnUrl()); return; }
            const form = status.configured ? loginForm : setupForm;
            form.hidden = false;
            form.querySelector('input').focus();
        } catch {
            errorEl.textContent = 'Could not reach the server.';
        }
    })();
})();
</script>
</body>
</html>
